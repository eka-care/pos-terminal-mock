<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="356" viewBox="0 0 1240 356" role="img" aria-label="Your app pushes an amount, the mock lets you choose how the sale ends - tap a card, decline, get stuck mid-payment, let it expire - and your integration must handle every answer the status call returns">
  <rect width="1240" height="356" fill="none"/>
  <text x="48" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e6edf3">Push a sale, choose how it ends, and make your code handle every answer.</text>

  <text x="48" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="0.6">1 - YOUR APP PUSHES AN AMOUNT</text>
  <rect x="48" y="76" width="272" height="230" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1.25"/>
  <text x="66" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="400" fill="#8b949e">POST</text>
  <text x="104" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#5b8cff">UploadBilledTransaction</text>
  <text x="66" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="400" fill="#8b949e">Amount</text><text x="186" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="400" fill="#e6edf3">"50000"</text><text x="240" y="136" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="400" fill="#6e7681">// paise</text>
  <text x="66" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="400" fill="#8b949e">AllowedPaymentMode</text><text x="186" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="400" fill="#e6edf3">"1|10"</text><text x="240" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="400" fill="#6e7681">// pipes</text>
  <text x="66" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="400" fill="#8b949e">SequenceNumber</text><text x="186" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="400" fill="#e6edf3">1001</text><text x="240" y="180" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="400" fill="#6e7681">// numeric</text>
  <text x="66" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="400" fill="#8b949e">AutoCancelDuration</text><text x="186" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="400" fill="#e6edf3">2</text><text x="240" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" font-weight="400" fill="#6e7681">// minutes</text>
  <rect x="66" y="240" width="236" height="1" fill="#30363d"/>
  <text x="66" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="400" fill="#8b949e">→ reference</text>
  <text x="186" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#5b8cff">877081</text>
  <text x="66" y="284" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8b949e">the sale’s identity from here on,</text>
  <text x="66" y="297" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8b949e">not the number you sent</text>
  <text x="48" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8b949e">No terminal. No account. No callback URL.</text>

  
  <path d="M332 191 L364 191" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M358 186 L364 191 L358 196" fill="none" stroke="#8b949e" stroke-width="1.5"/>

  <text x="376" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="0.6">2 - THIS IS THE MACHINE</text>
  
  <g>
    <rect x="378" y="79" width="440" height="230" rx="7" fill="#6e7681" opacity="0.16"/>
    <rect x="376" y="76" width="440" height="230" rx="7" fill="#161b22" stroke="#6e7681" stroke-width="1.25"/>
    <path d="M376 104 h440" stroke="#30363d" stroke-width="1"/>
    <circle cx="393" cy="90.5" r="3.6" fill="#30363d"/>
    <circle cx="405" cy="90.5" r="3.6" fill="#30363d"/>
    <circle cx="417" cy="90.5" r="3.6" fill="#30363d"/>
    <rect x="434" y="83" width="364" height="15" rx="7.5" fill="#0d1117"/>
    <text x="444" y="93.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="400" fill="#8b949e">localhost:8201</text>
    <text x="398" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#e6edf3">Pine Labs terminal (mock)</text>
    <text x="398" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8b949e">Push a sale from your app, then act as the customer here.</text>
    
    <rect x="388" y="158" width="416" height="1" fill="#262c36"/>
    <text x="398" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#e6edf3">₹500.00</text>
    <text x="480" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8b949e">Card · UPI</text>
    <text x="792" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#d29922" text-anchor="end">pending</text>
    <rect x="398" y="188" width="58.4" height="20" rx="4" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1"/>
    <text x="427.2" y="201.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" font-weight="400" fill="#3fb950" text-anchor="middle">Tap card</text>
    <rect x="462.4" y="188" width="69" height="20" rx="4" fill="#3fb950" fill-opacity="0.13" stroke="#3fb950" stroke-width="1"/>
    <text x="496.9" y="201.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" font-weight="400" fill="#3fb950" text-anchor="middle">Pay by UPI</text>
    <rect x="537.4" y="188" width="53.1" height="20" rx="4" fill="#f85149" fill-opacity="0.13" stroke="#f85149" stroke-width="1"/>
    <text x="563.9499999999999" y="201.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" font-weight="400" fill="#f85149" text-anchor="middle">Decline</text>
    <rect x="596.5" y="188" width="106.1" height="20" rx="4" fill="#d29922" fill-opacity="0.13" stroke="#d29922" stroke-width="1"/>
    <text x="649.55" y="201.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" font-weight="400" fill="#d29922" text-anchor="middle">Stuck mid-payment</text>
    <rect x="708.6" y="188" width="84.89999999999999" height="20" rx="4" fill="#0d1117" fill-opacity="1" stroke="#30363d" stroke-width="1"/>
    <text x="751.0500000000001" y="201.6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" font-weight="400" fill="#e6edf3" text-anchor="middle">Let it expire</text>
    
    <rect x="388" y="218" width="416" height="1" fill="#262c36"/>
    <text x="398" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#8b949e">₹1,200.00</text>
    <text x="480" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8b949e">All modes</text>
    <text x="792" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#3fb950" text-anchor="end">approved · CARD</text>
    <text x="398" y="258" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="400" fill="#8b949e">ref 877080  ·  machine 3923</text>
    <rect x="388" y="272" width="416" height="1" fill="#262c36"/>
    <text x="398" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8b949e">The machine offers only the modes your app allowed for that sale.</text>
  </g>
  <text x="376" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8b949e">You are the customer at the counter - including the endings hardware will not give you on demand.</text>

  
  <path d="M828 191 L860 191" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M854 186 L860 191 L854 196" fill="none" stroke="#8b949e" stroke-width="1.5"/>

  <text x="872" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#8b949e" letter-spacing="0.6">3 - YOU ASK HOW IT ENDED</text>
  
    <rect x="872" y="76" width="320" height="38" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="872" y="76" width="3.5" height="38" rx="1.75" fill="#3fb950"/>
    <text x="886" y="91" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#3fb950">0</text>
    <text x="916" y="91" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="400" fill="#e6edf3">TXN APPROVED</text>
    <text x="916" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8b949e">the card was taken</text>
    <rect x="872" y="122" width="320" height="38" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="872" y="122" width="3.5" height="38" rx="1.75" fill="#f85149"/>
    <text x="886" y="137" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#f85149">2</text>
    <text x="916" y="137" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="400" fill="#e6edf3">TXN DECLINED BY ISSUER</text>
    <text x="916" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8b949e">the card was refused</text>
    <rect x="872" y="168" width="320" height="38" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="872" y="168" width="3.5" height="38" rx="1.75" fill="#d29922"/>
    <text x="886" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#d29922">1001</text>
    <text x="916" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="400" fill="#e6edf3">TXN UPLOADED</text>
    <text x="916" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8b949e">still waiting - not a failure</text>
    <rect x="872" y="214" width="320" height="38" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="872" y="214" width="3.5" height="38" rx="1.75" fill="#8b949e"/>
    <text x="886" y="229" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#8b949e">1</text>
    <text x="916" y="229" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="400" fill="#e6edf3">INVALID TRANSACTION NUMBER</text>
    <text x="916" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8b949e">nobody paid, it expired</text>
    <rect x="872" y="260" width="320" height="38" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="872" y="260" width="3.5" height="38" rx="1.75" fill="#d29922"/>
    <text x="886" y="275" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="700" fill="#d29922">1</text>
    <text x="916" y="275" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5" font-weight="400" fill="#e6edf3">CANNOT CANCEL ... IN PROGRESS</text>
    <text x="916" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8b949e">mid-payment: do not double-collect</text>
  <text x="872" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8b949e">GetCloudBasedTxnStatus - branch on the code, never the HTTP status.</text>
</svg>
