<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="POS Terminal Mock - a stand-in card machine, so you can build a POS integration without the hardware">
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="6" fill="#5b8cff"/>
  <text x="88" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="74" font-weight="700" fill="#e6edf3">POS Terminal Mock</text>
  <text x="88" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="400" fill="#e6edf3">A stand-in card machine, for developers who do not have one.</text>
  <text x="88" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#8b949e">Build the whole flow - declines, timeouts, a customer who walks</text>
  <text x="88" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#8b949e">off mid-payment - before you ever hold a terminal.</text>
  <text x="88" y="406" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#8b949e" letter-spacing="0.8">EVERY ENDING, ON DEMAND</text>
